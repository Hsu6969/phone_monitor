name: Android build

on:
  push:
    paths-ignore:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk phone-monitor-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phone-monitor-debug-apk
          path: phone-monitor-debug.apk
          if-no-files-found: error

      # Publish the APK at a fixed URL that can be opened directly on a phone:
      # https://github.com/<owner>/<repo>/releases/download/debug-latest/phone-monitor-debug.apk
      - name: Publish to "debug-latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest phone-monitor-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "最新測試版 (debug)" \
            --notes "分支 ${GITHUB_REF_NAME}，commit ${GITHUB_SHA::7}。在手機上點 phone-monitor-debug.apk 下載安裝。"
